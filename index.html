<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- PWA Core -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0ea5e9" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Samsidh" />

    <!-- Android / Chrome PWA -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Samsidh" />

    <!-- SEO -->
    <title>Samsidh International School — Preschool Daily Log</title>
    <meta name="description" content="Manage daily activity logs, gate passes, and parent communication for Samsidh International School preschool." />
    <meta name="keywords" content="preschool, daily log, gate pass, parent portal, school app, Samsidh" />

    <!-- Open Graph -->
    <meta property="og:title" content="Samsidh International School" />
    <meta property="og:description" content="Preschool daily log & gate pass management" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Samsidh International School" />
    <meta name="twitter:image" content="/icon-512.png" />

    <!-- Preconnect for Supabase performance -->
    <link rel="preconnect" href="https://supabase.co" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js', { scope: '/' })
            .then((reg) => {
              console.log('[PWA] Service worker registered. Scope:', reg.scope);
              // Check for updates every 60 seconds while app is open
              setInterval(() => reg.update(), 60000);
            })
            .catch((err) => {
              console.warn('[PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
